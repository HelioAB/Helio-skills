name: CI
on:
  pull_request:
  schedule:
    # Nightly audit of main (22:17 China time); merges no longer trigger a run.
    - cron: '17 14 * * *'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.mjs
